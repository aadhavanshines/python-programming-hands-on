# Runs every program, shell session and test from the book on each Python
# version the book was tested with, and compares the output with the .out
# files. The results are public on the repository's Actions tab.
name: Check every listing

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  listings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the packages the book uses
        run: python -m pip install -r requirements.txt
      - name: Check every listing and shell session
        run: python tests/run_listings.py
      - name: Install and test the Chapter 17 package
        working-directory: code/ch17/pocket-library
        run: |
          python -m pip install -e ".[test]"
          pocket --version
          python -m pytest -q -p no:cacheprovider
